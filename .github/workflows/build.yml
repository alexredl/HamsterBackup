name: Build

on:
  push:
    branches: [main]
    tags: ['v*']        # a tag like v1.0 also creates a release
  pull_request:
  workflow_dispatch:     # "Run workflow" button on GitHub

permissions:
  contents: write        # needed to create releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build HamsterBackup.exe
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          call app\build.cmd

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item app\HamsterBackup.exe, Backup.ps1, backup-config.example.psd1, *.cmd, README.md dist\
          Compress-Archive dist\* HamsterBackup.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HamsterBackup
          path: HamsterBackup.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: HamsterBackup.zip